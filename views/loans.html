<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan System - Manage Loans</title>
    <link rel="stylesheet" href="css/applicants.css">
</head>
<body>
    <nav class="main-navbar">
        <div class="nav-container">
            <span class="brand">💰 LoanSystem</span>
            <ul class="nav-links">
                <li><a href="stats.html" class="active">Dashboard</a></li>
                <li><a href="applicants.html">Applicants</a></li>
                <li><a href="loans.html">Loans</a></li>
                <li><a href="repayments.html">Repayments</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Loan Management</h1>
            <div class="search-box">
                <!-- Changed to status filter for better UX -->
                <select id="statusFilter" onchange="filterByStatus()">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                    <option value="paid">Paid</option>
                </select>
            </div>
        </header>

        <main>
            <section class="form-section">
                <h2 id="formTitle">Issue New Loan</h2>
                <form id="loanForm">
                    <input type="hidden" id="editLoanId">
                    <div class="input-group">
                        <!-- User Friendly: Select by Name instead of typing ID -->
                        <label for="appId">Select Applicant:</label>
                        <select id="appId" required>
                            <option value="">-- Loading Applicants... --</option>
                        </select>

                        <label for="loanAmount">Amount (TZS):</label>
                        <input type="number" id="loanAmount" placeholder="Enter Amount" required min="1000">
                        
                        <!-- Status only shows during Edit mode -->
                        <div id="statusContainer" style="display:none;">
                            <label for="loanStatus">Loan Status:</label>
                            <select id="loanStatus">
                                <option value="pending">Pending</option>
                                <option value="approved">Approved</option>
                                <option value="rejected">Rejected</option>
                                <option value="paid">Paid</option>
                            </select>
                        </div>
                    </div>
                    <div class="button-group">
                        <button type="submit" id="submitBtn">Create Loan</button>
                        <button type="button" id="cancelBtn" style="display:none;" onclick="resetForm()">Cancel Edit</button>
                    </div>
                </form>
            </section>

            <section class="list-section">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Applicant Name</th>
                                <th>Loan Amount</th>
                                <th>Current Status</th>
                                <th>Date Issued</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="loanTableBody">
                            <!-- JS will inject rows here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="js/loans.js"></script>
    <script>
function logout() {
    localStorage.removeItem('token'); // Clear the session
    window.location.href = '/login';   // Go back to login
}
</script>
</body>
</html>
