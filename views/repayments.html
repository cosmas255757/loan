<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan System - Repayment Tracking</title>
    <link rel="stylesheet" href="css/applicants.css">
    <style>
        /* Specific status colors for repayments */
        .status-loading { background-color: #6c757d; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        .status-inprogress { background-color: #f39c12; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        .status-paid { background-color: #27ae60; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
        .text-danger { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="main-navbar">
        <div class="nav-container">
            <span class="brand">💰 LoanSystem</span>
            <ul class="nav-links">
                <li><a href="stats.html" class="active">Dashboard</a></li>
                <li><a href="applicants.html">Applicants</a></li>
                <li><a href="loans.html">Loans</a></li>
                <li><a href="repayments.html">Repayments</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Repayment Tracking</h1>
            <div class="search-box">
                <!-- User Friendly: Filter by Name instead of ID -->
                <input type="text" id="nameSearch" placeholder="Search by Applicant Name..." onkeyup="filterByName()">
            </div>
        </header>

        <main>
            <section class="form-section">
                <h2 id="formTitle">Record New Payment</h2>
                <form id="repaymentForm">
                    <input type="hidden" id="editRepaymentId">
                    <div class="input-group">
                        <label for="loanId">Select Loan Record:</label>
                        <select id="loanId" required>
                            <option value="">-- Loading Active Loans... --</option>
                        </select>

                        <label for="amountPaid">Amount Paid (TZS):</label>
                        <input type="number" id="amountPaid" placeholder="Enter Amount" required min="1">
                        
                        <label for="paymentDate">Date of Payment:</label>
                        <input type="date" id="paymentDate" required>
                    </div>
                    <div class="button-group">
                        <button type="submit" id="submitBtn">Save Payment</button>
                        <button type="button" id="cancelBtn" style="display:none;" onclick="resetForm()">Cancel Edit</button>
                    </div>
                </form>
            </section>

            <section class="list-section">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Applicant Name</th>
                                <th>Amount Paid</th>
                                <th>Amount Left</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="repaymentTableBody">
                            <!-- JS will inject rows here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="js/repayments.js"></script>
    <script>
function logout() {
    localStorage.removeItem('token'); // Clear the session
    window.location.href = '/login';   // Go back to login
}
</script>
</body>
</html>
