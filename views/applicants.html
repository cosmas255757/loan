<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan System - Applicants</title>
    <link rel="stylesheet" href="css/applicants.css">
</head>
<body>
    <!-- Main Navigation Bar -->
    <nav class="main-navbar">
        <div class="nav-container">
            <span class="brand">💰 LoanSystem</span>
            <ul class="nav-links">
                <li><a href="stats.html" class="active">Dashboard</a></li>
                <li><a href="applicants.html">Applicants</a></li>
                <li><a href="loans.html">Loans</a></li>
                <li><a href="repayments.html">Repayments</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Applicant Management</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by name..." onkeyup="searchApp()">
            </div>
        </header>

        <main>
            <!-- Create / Update Section -->
            <section class="form-section">
                <h2 id="formTitle">Register New Applicant</h2>
              <form id="applicantForm">
                    <input type="hidden" id="editId">
                    
                    <div class="input-group">
                        <!-- Existing Fields -->
                        <input type="text" id="fullName" placeholder="Full Name" required>
                        <input type="text" id="phone" placeholder="Phone Number" required>

                        <!-- New Fields -->
                        <input type="text" id="livingLocation" placeholder="Living Location">
                        <input type="text" id="occupation" placeholder="Occupation">

                        <!-- Dropdowns for restricted values -->
                        <select id="sex">
                            <option value="">Select Sex</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>

                        <select id="relationshipStatus">
                            <option value="">Select Relationship Status</option>
                            <option value="Single">Single</option>
                            <option value="Married">Married</option>
                            <option value="Divorced">Divorced</option>
                            <option value="Widowed">Widowed</option>
                        </select>
                    </div>

                    <div class="button-group">
                        <button type="submit" id="submitBtn">Save Applicant</button>
                        <button type="button" id="cancelBtn" style="display:none;" onclick="resetForm()">Cancel Edit</button>
                    </div>
                </form>

            </section>

            <!-- Table Section -->
            <section class="list-section">
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Full Name</th>
                    <th>Phone Number</th>
                    <th>Location</th>
                    <th>Occupation</th>
                    <th>Sex</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="applicantTableBody">
                <!-- Data will be injected here by fetchApplicants() -->
            </tbody>
        </table>
    </div>
</section>

        </main>
    </div>
    <script src="js/applicants.js"></script>
</body>
</html>
